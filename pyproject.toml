[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ew-manim-draw"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["manim>=0.18,<0.20"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
ew-manim-draw = "ew_manim_draw.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
